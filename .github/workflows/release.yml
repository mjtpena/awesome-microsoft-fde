name: Release

# Push a tag such as v1.0.0 to publish a release with the skills attached.
# The release notes are the "## Unreleased" section of CHANGELOG.md; rename
# that heading to the version before tagging.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the docs before releasing
        run: python3 scripts/check_docs.py

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / {
              if (found) exit
              h = $2; gsub(/[][]/, "", h); sub(/^v/, "", h)
              if (h == v) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi

      - name: Package the skills
        run: zip -r skills.zip skills

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" skills.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
